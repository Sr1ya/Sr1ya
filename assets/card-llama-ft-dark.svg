<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="Fine-Tuned Llama-3.1-8B">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#facc15"/><stop offset=".6" stop-color="#1e293b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#facc15" stop-opacity="0"/><stop offset=".5" stop-color="#facc15" stop-opacity=".10"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#facc15" stop-opacity="0.28"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="590" height="270" rx="18"/></clipPath>
  <style>
    .t { font: 800 25px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e2e8f0; letter-spacing: -.3px; }
    .d { font: 400 15.5px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
    .p { font: 600 12.5px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; }
    .b { font: 700 12.5px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; letter-spacing: 1px; }
    .i { font: 26px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .sh { animation: sh 5s ease-in-out infinite; }
    @keyframes sh { 0% { transform: translateX(-300px) } 60%,100% { transform: translateX(890px) } }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 10s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</defs>
<g clip-path="url(#c)">
  <rect width="590" height="270" fill="#0f172a"/>
  <rect width="590" height="270" fill="url(#gl)"/>
  <rect class="sh" x="0" y="0" width="220" height="270" fill="url(#sh)" transform="skewX(-20)"/>
  <rect x="0" y="0" width="590" height="4" fill="#facc15"/>
</g>
<rect x="1" y="1" width="588" height="268" rx="17" fill="none" stroke="url(#bd)" stroke-width="2"/>
<circle cx="56" cy="62" r="24" fill="#facc15" fill-opacity="0.14"/>
<circle class="ring" cx="56" cy="62" r="24" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="18 10"/>
<g transform="translate(56 62)"><path d="M-10 8L-10 -2Q-10 -8 -5 -8L-5 -12M5 -8L5 -12M-5 -8H5Q10 -8 10 -2V8" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round"/><circle cx="-3" cy="-2" r="1.6" fill="#facc15"/><circle cx="3" cy="-2" r="1.6" fill="#facc15"/></g>
<text x="96" y="72" class="t">Fine-Tuned Llama-3.1-8B</text>
<rect x="491" y="30" width="67" height="26" rx="13" fill="#facc15" fill-opacity="0.16" stroke="#facc15"/><text x="524" y="48" text-anchor="middle" class="b" fill="#facc15">ON HF</text>
<text x="32" y="124" class="d">Instruction fine-tuning of Llama-3.1-8B-Instruct in 4-bit on a</text><text x="32" y="148" class="d">domain-specific dataset with Unsloth, trained on a single GPU. The</text><text x="32" y="172" class="d">fine-tuned weights are published on Hugging Face for public use.</text>
<rect x="32" y="222" width="78" height="26" rx="13" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.35"/><text x="71" y="240" text-anchor="middle" class="p" fill="#facc15">Unsloth</text><rect x="118" y="222" width="62" height="26" rx="13" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.35"/><text x="149" y="240" text-anchor="middle" class="p" fill="#facc15">QLoRA</text><rect x="188" y="222" width="62" height="26" rx="13" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.35"/><text x="219" y="240" text-anchor="middle" class="p" fill="#facc15">4-bit</text><rect x="258" y="222" width="118" height="26" rx="13" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.35"/><text x="317" y="240" text-anchor="middle" class="p" fill="#facc15">Hugging Face</text>
</svg>