<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="Infra-Pulse">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0284c7"/><stop offset=".6" stop-color="#e2e8f0"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#0284c7" stop-opacity="0"/><stop offset=".5" stop-color="#0284c7" stop-opacity=".10"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#0284c7" stop-opacity="0.11"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="590" height="270" rx="18"/></clipPath>
  <style>
    .t { font: 800 25px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; letter-spacing: -.3px; }
    .d { font: 400 15.5px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
    .p { font: 600 12.5px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; }
    .b { font: 700 12.5px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; letter-spacing: 1px; }
    .i { font: 26px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .sh { animation: sh 5s ease-in-out infinite; }
    @keyframes sh { 0% { transform: translateX(-300px) } 60%,100% { transform: translateX(890px) } }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 10s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</defs>
<g clip-path="url(#c)">
  <rect width="590" height="270" fill="#ffffff"/>
  <rect width="590" height="270" fill="url(#gl)"/>
  <rect class="sh" x="0" y="0" width="220" height="270" fill="url(#sh)" transform="skewX(-20)"/>
  <rect x="0" y="0" width="590" height="4" fill="#0284c7"/>
</g>
<rect x="1" y="1" width="588" height="268" rx="17" fill="none" stroke="url(#bd)" stroke-width="2"/>
<circle cx="56" cy="62" r="24" fill="#0284c7" fill-opacity="0.14"/>
<circle class="ring" cx="56" cy="62" r="24" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="18 10"/>
<g transform="translate(56 62)"><path d="M-12 2H-6L-3 -8L2 10L5 -2L7 2H12" fill="none" stroke="#0284c7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="96" y="72" class="t">Infra-Pulse</text>
<rect x="482" y="30" width="76" height="26" rx="13" fill="#ca8a04" fill-opacity="0.16" stroke="#ca8a04"/><text x="520" y="48" text-anchor="middle" class="b" fill="#ca8a04">WINNER</text>
<text x="32" y="124" class="d">Predicts infrastructure damage before it becomes visible. Prophet +</text><text x="32" y="148" class="d">LSTM forecast degradation from trend data; an Ollama layer turns</text><text x="32" y="172" class="d">predictions into plain-language maintenance advice, not a bare risk</text><text x="32" y="196" class="d">score. Full-stack risk dashboard.</text>
<rect x="32" y="222" width="78" height="26" rx="13" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-opacity="0.35"/><text x="71" y="240" text-anchor="middle" class="p" fill="#0284c7">Prophet</text><rect x="118" y="222" width="54" height="26" rx="13" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-opacity="0.35"/><text x="145" y="240" text-anchor="middle" class="p" fill="#0284c7">LSTM</text><rect x="180" y="222" width="70" height="26" rx="13" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-opacity="0.35"/><text x="215" y="240" text-anchor="middle" class="p" fill="#0284c7">Ollama</text><rect x="258" y="222" width="110" height="26" rx="13" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-opacity="0.35"/><text x="313" y="240" text-anchor="middle" class="p" fill="#0284c7">Time-Series</text><rect x="376" y="222" width="102" height="26" rx="13" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-opacity="0.35"/><text x="427" y="240" text-anchor="middle" class="p" fill="#0284c7">Full-Stack</text>
</svg>