<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="Text-to-Video Engine">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777"/><stop offset=".6" stop-color="#e2e8f0"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#db2777" stop-opacity="0"/><stop offset=".5" stop-color="#db2777" stop-opacity=".10"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#db2777" stop-opacity="0.11"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="590" height="270" rx="18"/></clipPath>
  <style>
    .t { font: 800 25px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; letter-spacing: -.3px; }
    .d { font: 400 15.5px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
    .p { font: 600 12.5px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; }
    .b { font: 700 12.5px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; letter-spacing: 1px; }
    .i { font: 26px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .sh { animation: sh 5s ease-in-out infinite; }
    @keyframes sh { 0% { transform: translateX(-300px) } 60%,100% { transform: translateX(890px) } }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 10s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</defs>
<g clip-path="url(#c)">
  <rect width="590" height="270" fill="#ffffff"/>
  <rect width="590" height="270" fill="url(#gl)"/>
  <rect class="sh" x="0" y="0" width="220" height="270" fill="url(#sh)" transform="skewX(-20)"/>
  <rect x="0" y="0" width="590" height="4" fill="#db2777"/>
</g>
<rect x="1" y="1" width="588" height="268" rx="17" fill="none" stroke="url(#bd)" stroke-width="2"/>
<circle cx="56" cy="62" r="24" fill="#db2777" fill-opacity="0.14"/>
<circle class="ring" cx="56" cy="62" r="24" fill="none" stroke="#db2777" stroke-width="2" stroke-dasharray="18 10"/>
<g transform="translate(56 62)"><rect x="-11" y="-8" width="16" height="16" rx="3" fill="none" stroke="#db2777" stroke-width="2.2"/><path d="M5 -3L12 -7V7L5 3Z" fill="#db2777"/></g>
<text x="96" y="72" class="t">Text-to-Video Engine</text>
<rect x="508" y="30" width="50" height="26" rx="13" fill="#db2777" fill-opacity="0.16" stroke="#db2777"/><text x="533" y="48" text-anchor="middle" class="b" fill="#db2777">NEW</text>
<text x="32" y="124" class="d">Turns any website or topic into a narrated, captioned 1080p video.</text><text x="32" y="148" class="d">Crawls text, images, audio and video into a multimodal FAISS index</text><text x="32" y="172" class="d">(CLIP + Whisper + SSIM frame dedup), Llama 4 on Groq writes the</text><text x="32" y="196" class="d">script, MoviePy assembles the MP4.</text>
<rect x="32" y="222" width="54" height="26" rx="13" fill="#db2777" fill-opacity="0.12" stroke="#db2777" stroke-opacity="0.35"/><text x="59" y="240" text-anchor="middle" class="p" fill="#db2777">CLIP</text><rect x="94" y="222" width="78" height="26" rx="13" fill="#db2777" fill-opacity="0.12" stroke="#db2777" stroke-opacity="0.35"/><text x="133" y="240" text-anchor="middle" class="p" fill="#db2777">Whisper</text><rect x="180" y="222" width="62" height="26" rx="13" fill="#db2777" fill-opacity="0.12" stroke="#db2777" stroke-opacity="0.35"/><text x="211" y="240" text-anchor="middle" class="p" fill="#db2777">FAISS</text><rect x="250" y="222" width="78" height="26" rx="13" fill="#db2777" fill-opacity="0.12" stroke="#db2777" stroke-opacity="0.35"/><text x="289" y="240" text-anchor="middle" class="p" fill="#db2777">Llama 4</text><rect x="336" y="222" width="78" height="26" rx="13" fill="#db2777" fill-opacity="0.12" stroke="#db2777" stroke-opacity="0.35"/><text x="375" y="240" text-anchor="middle" class="p" fill="#db2777">MoviePy</text>
</svg>