<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="Multimodal Emotion AI">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c6ff"/><stop offset=".6" stop-color="#1e293b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#00c6ff" stop-opacity="0"/><stop offset=".5" stop-color="#00c6ff" stop-opacity=".10"/><stop offset="1" stop-color="#00c6ff" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#00c6ff" stop-opacity="0.28"/><stop offset="1" stop-color="#00c6ff" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="590" height="270" rx="18"/></clipPath>
  <style>
    .t { font: 800 25px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e2e8f0; letter-spacing: -.3px; }
    .d { font: 400 15.5px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
    .p { font: 600 12.5px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; }
    .b { font: 700 12.5px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; letter-spacing: 1px; }
    .i { font: 26px 'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .sh { animation: sh 5s ease-in-out infinite; }
    @keyframes sh { 0% { transform: translateX(-300px) } 60%,100% { transform: translateX(890px) } }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 10s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</defs>
<g clip-path="url(#c)">
  <rect width="590" height="270" fill="#0f172a"/>
  <rect width="590" height="270" fill="url(#gl)"/>
  <rect class="sh" x="0" y="0" width="220" height="270" fill="url(#sh)" transform="skewX(-20)"/>
  <rect x="0" y="0" width="590" height="4" fill="#00c6ff"/>
</g>
<rect x="1" y="1" width="588" height="268" rx="17" fill="none" stroke="url(#bd)" stroke-width="2"/>
<circle cx="56" cy="62" r="24" fill="#00c6ff" fill-opacity="0.14"/>
<circle class="ring" cx="56" cy="62" r="24" fill="none" stroke="#00c6ff" stroke-width="2" stroke-dasharray="18 10"/>
<g transform="translate(56 62)"><path d="M-12 0Q-8 -10 -4 0T4 0T12 0" fill="none" stroke="#00c6ff" stroke-width="2.4" stroke-linecap="round"/><path d="M-12 7Q-8 2 -4 7T4 7T12 7" fill="none" stroke="#00c6ff" stroke-width="1.5" opacity=".6"/></g>
<text x="96" y="72" class="t">Multimodal Emotion AI</text>

<text x="32" y="124" class="d">Emotion and sentiment classifier on the MELD dataset that late-</text><text x="32" y="148" class="d">fuses BERT text embeddings, CNN audio features and vision frame</text><text x="32" y="172" class="d">features, deployed as an AWS SageMaker endpoint behind a full-stack</text><text x="32" y="196" class="d">SaaS app.</text>
<rect x="32" y="222" width="78" height="26" rx="13" fill="#00c6ff" fill-opacity="0.12" stroke="#00c6ff" stroke-opacity="0.35"/><text x="71" y="240" text-anchor="middle" class="p" fill="#00c6ff">PyTorch</text><rect x="118" y="222" width="54" height="26" rx="13" fill="#00c6ff" fill-opacity="0.12" stroke="#00c6ff" stroke-opacity="0.35"/><text x="145" y="240" text-anchor="middle" class="p" fill="#00c6ff">BERT</text><rect x="180" y="222" width="94" height="26" rx="13" fill="#00c6ff" fill-opacity="0.12" stroke="#00c6ff" stroke-opacity="0.35"/><text x="227" y="240" text-anchor="middle" class="p" fill="#00c6ff">SageMaker</text><rect x="282" y="222" width="102" height="26" rx="13" fill="#00c6ff" fill-opacity="0.12" stroke="#00c6ff" stroke-opacity="0.35"/><text x="333" y="240" text-anchor="middle" class="p" fill="#00c6ff">Multimodal</text>
</svg>